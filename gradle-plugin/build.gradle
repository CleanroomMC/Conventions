plugins {
    id 'com.cleanroommc.conventions.bootstrap'
    id 'java-gradle-plugin'
}

group = 'com.cleanroommc'
base.archivesName = 'conventions'

conventions {
    beginFrom = 2021
}

repositories {
    mavenCentral()
    gradlePluginPortal()
    maven {
        url = 'https://maven.cleanroommc.com'
    }
}

ext.conventionsPluginDir = '.'
apply from: "${conventionsPluginDir}/gradle/conventions-sources.gradle"

dependencies {
    testImplementation gradleTestKit()
}

def conventionRoot = layout.projectDirectory.dir('..')
def consumerTestRepository = layout.buildDirectory.dir('consumer-test-repository')

publishing {
    repositories {
        maven {
            name = 'consumerTest'
            url = consumerTestRepository
        }
    }
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'published-consumer'
    }
}

tasks.register('publishedConsumerTest', Test) {
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'published-consumer'
    }
    dependsOn tasks.named('publishAllPublicationsToConsumerTestRepository')
    systemProperty 'conventions.testRepository', consumerTestRepository.get().asFile.toURI()
    systemProperty 'conventions.testVersion', project.version.toString()
}

tasks.named('check') {
    dependsOn tasks.named('publishedConsumerTest')
}

// The root LICENSE is the packed template, so it intentionally retains @YEAR@.
tasks.named('checkLicense') {
    expected.set(providers.fileContents(conventionRoot.file('LICENSE')).asText)
}

gradlePlugin {
    website = 'https://github.com/CleanroomMC/Conventions'
    vcsUrl = 'https://github.com/CleanroomMC/Conventions.git'
    plugins {
        conventions {
            id = "${group}.conventions"
            implementationClass = "${group}.conventions.ConventionsPlugin"
            displayName = 'Cleanroom Conventions'
            description = 'Sets project conventions for CleanroomMC projects.'
        }
        conventionsBase {
            id = "${group}.conventions.base"
            implementationClass = "${group}.conventions.ConventionsBasePlugin"
            displayName = 'Cleanroom Base Conventions'
            description = 'Sets base project conventions for CleanroomMC projects.'
        }
        conventionsLicense {
            id = "${group}.conventions.license"
            implementationClass = "${group}.conventions.ConventionsLicensePlugin"
            displayName = 'Cleanroom License Conventions'
            description = 'Sets license conventions for CleanroomMC projects.'
        }
        conventionsStyle {
            id = "${group}.conventions.style"
            implementationClass = "${group}.conventions.ConventionsStylePlugin"
            displayName = 'Cleanroom Style Conventions'
            description = 'Sets code style conventions for CleanroomMC projects.'
        }
        conventionsAnnotations {
            id = "${group}.conventions.annotations"
            implementationClass = "${group}.conventions.ConventionsAnnotationsPlugin"
            displayName = 'Cleanroom Annotations Conventions'
            description = 'Sets annotation library conventions for CleanroomMC projects.'
        }
        conventionsTesting {
            id = "${group}.conventions.testing"
            implementationClass = "${group}.conventions.ConventionsTestingPlugin"
            displayName = 'Cleanroom Testing Conventions'
            description = 'Sets testing conventions for CleanroomMC projects.'
        }
        conventionsBenchmarking {
            id = "${group}.conventions.benchmarking"
            implementationClass = "${group}.conventions.ConventionsBenchmarkingPlugin"
            displayName = 'Cleanroom Benchmarking Conventions'
            description = 'Sets JMH benchmarking conventions for CleanroomMC projects.'
        }
        conventionsPublishing {
            id = "${group}.conventions.publishing"
            implementationClass = "${group}.conventions.ConventionsPublishingPlugin"
            displayName = 'Cleanroom Publishing Conventions'
            description = 'Sets publishing conventions for CleanroomMC projects.'
        }
        conventionsMod {
            id = "${group}.conventions.mod"
            implementationClass = "${group}.conventions.ConventionsModPlugin"
            displayName = 'Cleanroom Mod Conventions'
            description = 'Sets mod conventions for CleanroomMC projects.'
        }
        conventionsSettings {
            id = "${group}.conventions.settings"
            implementationClass = "${group}.conventions.ConventionsSettingsPlugin"
            displayName = 'Cleanroom Conventions Settings'
            description = 'Sets settings conventions for CleanroomMC projects.'
        }
        configureEach {
            tags.set(['minecraft', 'conventions', '1.12', 'cleanroom', 'format', ''])
            compatibility {
                features {
                    configurationCache = true
                }
            }
        }
    }
}

publishing {
    publications {
        pluginMaven(MavenPublication) {
            artifactId = 'conventions'
        }
    }
}
