name: Build

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory that contains the Gradle wrapper. Omit to use the repository root, or a nested wrapper if the root has none.
        type: string
        default: '.'
      artifact-path:
        description: Paths to upload after a successful build.
        type: string
        default: '**/build/libs'
      if-no-files-found:
        description: Behaviour when no artifact is matched. One of warn, error or ignore.
        type: string
        default: warn
      java-version:
        description: Temurin JDKs to install, one per line. The last one launches Gradle.
        type: string
        default: |-
          8
          25
      submodules:
        description: Whether to check out submodules. true, recursive or false, passed to actions/checkout.
        type: string
        default: 'true'
      release-branch:
        description: Branch merges are skipped on, matching versioning.releaseBranch.
        type: string
        default: master
      timeout-minutes:
        description: Job timeout in minutes.
        type: number
        default: 15
      cache-provider:
        description: Gradle User Home cache. basic is MIT-licensed. enhanced is Gradle's proprietary provider and accepts its Terms of Use.
        type: string
        default: enhanced
      build-scan-publish:
        description: Publish build scans to the public Gradle scan service.
        type: boolean
        default: true

permissions:
  contents: read

# Uses the caller's workflow name and ref, so each calling repository gets its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guard:
    # Draft PRs wait until they are marked ready for review.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check for a release branch merge
        id: check
        env:
          RELEASE_BRANCH: ${{ inputs.release-branch }}
        run: |
          set -euo pipefail
          parents=$(git rev-list --parents -n 1 HEAD | wc -w)
          if [ "$parents" -gt 2 ] && [ "$GITHUB_REF" = "refs/heads/${RELEASE_BRANCH}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: guard
    # A merge into the release branch computes the next patch of the previous tag, a version that never ships.
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          submodules: ${{ inputs.submodules }}

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Locate Gradle wrapper
        id: gradle
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          if [ -f "${WORKING_DIRECTORY}/gradlew" ]; then
            echo "dir=${WORKING_DIRECTORY}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t wrappers < <(find . -maxdepth 2 -type f -name gradlew ! -path './.git/*' | sort)
          if [ "${#wrappers[@]}" -eq 1 ]; then
            echo "dir=$(dirname "${wrappers[0]}")" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::Gradle wrapper not found in '${WORKING_DIRECTORY}', and no unique wrapper within two directory levels."
          exit 1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
          cache-provider: ${{ inputs.cache-provider }}
          build-scan-publish: ${{ inputs.build-scan-publish }}
          build-scan-terms-of-use-url: ${{ inputs.build-scan-publish && 'https://gradle.com/help/legal-terms-of-use' || '' }}
          build-scan-terms-of-use-agree: ${{ inputs.build-scan-publish && 'yes' || '' }}

      - name: Build
        working-directory: ${{ steps.gradle.outputs.dir }}
        run: ./gradlew build

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libs
          path: ${{ inputs.artifact-path }}
          if-no-files-found: ${{ inputs.if-no-files-found }}
