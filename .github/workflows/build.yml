name: Build

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory that contains the Gradle wrapper. Omit to use the repository root, or a nested wrapper if the root has none.
        type: string
        default: '.'
      artifact-path:
        description: Paths to upload after a successful build.
        type: string
        default: '**/build/libs'
      if-no-files-found:
        description: Behaviour when no artifact is matched. One of warn, error or ignore.
        type: string
        default: warn
      java-version:
        description: Temurin JDK used to launch Gradle. The project toolchain can still request a different language version.
        type: string
        default: '25'
      timeout-minutes:
        description: Job timeout in minutes.
        type: number
        default: 15
      cache-provider:
        description: Gradle User Home cache. basic is MIT-licensed. enhanced is Gradle's proprietary provider and accepts its Terms of Use.
        type: string
        default: enhanced
      build-scan-publish:
        description: Publish build scans to the public Gradle scan service.
        type: boolean
        default: true

permissions:
  contents: read

# Uses the caller's workflow name and ref, so each calling repository gets its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Draft PRs wait until they are marked ready for review.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Locate Gradle wrapper
        id: gradle
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          if [ -f "${WORKING_DIRECTORY}/gradlew" ]; then
            echo "dir=${WORKING_DIRECTORY}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t wrappers < <(find . -maxdepth 2 -type f -name gradlew ! -path './.git/*' | sort)
          if [ "${#wrappers[@]}" -eq 1 ]; then
            echo "dir=$(dirname "${wrappers[0]}")" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::Gradle wrapper not found in '${WORKING_DIRECTORY}', and no unique wrapper within two directory levels."
          exit 1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
          cache-provider: ${{ inputs.cache-provider }}
          build-scan-publish: ${{ inputs.build-scan-publish }}
          build-scan-terms-of-use-url: ${{ inputs.build-scan-publish && 'https://gradle.com/help/legal-terms-of-use' || '' }}
          build-scan-terms-of-use-agree: ${{ inputs.build-scan-publish && 'yes' || '' }}

      - name: Build
        working-directory: ${{ steps.gradle.outputs.dir }}
        run: ./gradlew build

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libs
          path: ${{ inputs.artifact-path }}
          if-no-files-found: ${{ inputs.if-no-files-found }}
